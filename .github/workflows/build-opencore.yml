
name: Build OpenCore for iMac 2011

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download official OCLP source
        uses: actions/checkout@v4
        with:
          repository: dortania/OpenCore-Legacy-Patcher
          path: oclp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: oclp
        run: python -m pip install -r requirements.txt

      - name: Build OpenCore for iMac12,2
        working-directory: oclp
        run: python OpenCore-Patcher-GUI.command --build --model iMac12,2 --verbose

     
      - name: Collect EFI files
        shell: bash
        run: |
          CONFIG=$(find oclp -type f -path '*/EFI/OC/config.plist' -print -quit)
          if [ -z "$CONFIG" ]; then
            echo "ERROR: OpenCore config.plist not found"
            exit 1
          fi

          EFI_DIR=$(dirname "$(dirname "$CONFIG")")
          BUILD_DIR=$(dirname "$EFI_DIR")

          echo "OpenCore build directory: $BUILD_DIR"
          echo "Checking available boot files:"
          find "$BUILD_DIR" -maxdepth 6 -type f \
            \( -name "boot.efi" -o -name "BOOTx64.efi" \) -print

          mkdir -p output
          cp -R "$EFI_DIR" output/EFI

          if [ -d "$BUILD_DIR/System" ]; then
            cp -R "$BUILD_DIR/System" output/System
          fi

          if [ -f "$BUILD_DIR/boot.efi" ]; then
            cp "$BUILD_DIR/boot.efi" output/boot.efi
          fi

          echo "Collected bootloader files:"
          find output -maxdepth 6 -type f -print

          test -f output/EFI/OC/config.plist
          test -f output/EFI/OC/OpenCore.efi

          if [ ! -f output/EFI/BOOT/BOOTx64.efi ] && \
             [ ! -f output/System/Library/CoreServices/boot.efi ]; then
            echo "ERROR: No supported boot entry file found"
            exit 1
          fi


      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-iMac12-2
          path: output/
          if-no-files-found: error
